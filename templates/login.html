{% extends "base.html" %}
{% block title %}Log in · AI Resume Analyzer{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <a class="auth-brand" href="/"><span class="brand-mark">AI</span> Resume Analyzer</a>
        <h2>Welcome back</h2>
        <p class="sub-text">Log in to see your dashboard and reports</p>
        {% include "_flash.html" %}
        <form method="POST">
            <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
            <input type="email" name="email" placeholder="Email" required autofocus>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>
        <p class="switch-auth">Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
    </div>
</div>
{% endblock %}
