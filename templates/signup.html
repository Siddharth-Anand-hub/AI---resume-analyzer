{% extends "base.html" %}
{% block title %}Sign up · AI Resume Analyzer{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <a class="auth-brand" href="/"><span class="brand-mark">AI</span> Resume Analyzer</a>
        <h2>Create account</h2>
        <p class="sub-text">Start your AI career journey</p>
        {% include "_flash.html" %}
        <form method="POST">
            <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password (min 6 characters)" minlength="6" required>
            <button type="submit">Create account</button>
        </form>
        <p class="switch-auth">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
